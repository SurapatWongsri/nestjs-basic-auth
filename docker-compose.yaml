# compose.yaml
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '${DB_PORT}:5432' # แม้แต่ Port ก็ควรอ่านจาก env เพื่อความยืดหยุ่น
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck: # Best Practice: เพิ่ม Healthcheck ให้รู้ว่า DB พร้อมจริงหรือยัง
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
